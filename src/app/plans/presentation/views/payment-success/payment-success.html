<div class="success-container">
  <mat-icon class="success-icon">check_circle</mat-icon>
  <h1 class="success-title">{{ 'plans.payment.successTitle' | translate }}</h1>
  <p class="success-message">{{ 'plans.payment.successMessage' | translate }}</p>
  <button mat-raised-button color="primary" class="back-btn" (click)="backToPlans()">
    {{ 'plans.payment.backToPlans' | translate }}
  </button>
</div>
