<div class="login-container">
  <div class="login-card">
    <h1 class="title">{{ 'auth.login.title' | translate }}</h1>
    <p class="subtitle">{{ 'auth.login.subtitle' | translate }}</p>

    <div *ngIf="!dataLoaded" class="loading-indicator">
      <div class="spinner"></div>
      <p>{{ loadingMessage }}</p>
    </div>

    <div class="buttons-container" [class.disabled]="!dataLoaded">
      <button
        class="btn btn-primary"
        (click)="navigateToPhoneLogin()"
        [disabled]="!dataLoaded"
      >
        {{ 'auth.login.loginWithPhone' | translate }}
      </button>

      <button
        class="btn btn-text"
        (click)="navigateToEmailLogin()"
        [disabled]="!dataLoaded"
      >
        {{ 'auth.login.loginWithEmail' | translate }}
      </button>

      <button
        class="btn btn-guest"
        (click)="loginAsGuest()"
        [disabled]="!dataLoaded"
      >
        {{ 'auth.login.continueAsGuest' | translate }}
      </button>

      @if (guestError()) {
        <div class="guest-error" role="alert">
          {{ guestError() }}
        </div>
      }
    </div>

    <div class="terms">
      <p>{{ 'auth.login.termsLine' | translate }}</p>
    </div>
  </div>

  <div class="illustration">
    <img src="assets/auth/weride-loginscreen.png" [alt]="'auth.login.title' | translate" />
  </div>
</div>
